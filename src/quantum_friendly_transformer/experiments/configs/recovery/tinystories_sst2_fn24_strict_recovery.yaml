protocol: glue_sequence_classifier
defaults:
  protocol: glue_sequence_classifier
  args:
    task: sst2
    caps: [24]
    checkpoints: [0, 600, 1000, 1500, 2000, 3000, 4000, 5000, 7000, 10000]
    metric: accuracy
    tolerance: 0.01
    max_length: 128
    pad_to_max_length: true
    batch_size: 16
    eval_batch_size: 32
    grad_accum_steps: 2
    learning_rate: 2e-4
    weight_decay: 0.01
    warmup_ratio: 0.06
    optimizer: adamw
    train_scope: all
    dtype: bfloat16
    cap_norm_dtype: float32
    max_grad_norm: 1.0
    force_decoder_wrapper: true
    seed: 42
    device: cuda:0
runs:
  - name: tinystories_1m_fn24_strict_target
    args:
      model: roneneldan/TinyStories-1M
      baseline_target: 0.823394495412844
      output: experiments/outputs/raw/recovery_sst2_tinystories_1m_fn24_stricttarget823394_steps10000_fulltrain.json
  - name: tinystories_3m_fn24_strict_target
    args:
      model: roneneldan/TinyStories-3M
      baseline_target: 0.8188073394495413
      output: experiments/outputs/raw/recovery_sst2_tinystories_3m_fn24_stricttarget818807_steps10000_fulltrain.json
  - name: tinystories_8m_fn24_strict_target
    args:
      model: roneneldan/TinyStories-8M
      baseline_target: 0.8337155963302753
      output: experiments/outputs/raw/recovery_sst2_tinystories_8m_fn24_stricttarget833716_steps10000_fulltrain.json

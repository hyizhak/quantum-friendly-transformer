protocol: glue_sequence_classifier
defaults:
  protocol: glue_sequence_classifier
  args:
    task: sst2
    caps: [24]
    checkpoints: [0, 300, 600, 1000, 1500, 2000, 3000, 4000, 5000, 7000, 10000]
    metric: accuracy
    tolerance: 0.01
    max_length: 128
    pad_to_max_length: true
    attention_scaling: alpha_s_alpha_w
    alpha_w: 24
    trainable_attention_scaling: true
    enforce_alpha_denominator_bound: true
    attention_scale_learning_rate: 0.01
    attention_scale_adam_eps: 1.0e-12
    alpha_s_calibration_batches: 28
    alpha_s_calibration_margin: 1.05
    batch_size: 16
    eval_batch_size: 32
    grad_accum_steps: 2
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.06
    lr_scheduler: linear
    optimizer: adamw
    train_scope: all
    dtype: bfloat16
    cap_norm_dtype: float32
    max_grad_norm: 1.0
    force_decoder_wrapper: true
    seed: 42
    device: cuda:0
    offline: true
    early_stop_on_recovery: true
    save_recovery_checkpoint: true
runs:
  - name: tinystories_1m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-1M
      alpha_s: 8.0
      baseline_target: 0.823394495412844
      checkpoints: [0, 300, 600, 1000, 1500, 2000, 3000, 4000, 5000, 7000, 10000, 12500, 15000, 20000]
      learning_rate: 3.0e-4
      output: experiments/outputs/raw/recovery_sst2_tinystories_1m_fn24_bounded_alpha_attention_steps20000.json
  - name: tinystories_3m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-3M
      alpha_s: 11.313708498984761
      baseline_target: 0.8188073394495413
      checkpoints: [0, 300, 600, 1000, 1500, 2000, 3000, 4000, 5000, 7000, 10000, 12500, 15000, 20000]
      learning_rate: 1.0e-4
      warmup_ratio: 0.10
      output: experiments/outputs/raw/recovery_sst2_tinystories_3m_fn24_bounded_alpha_attention_steps20000.json
  - name: tinystories_8m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-8M
      alpha_s: 16.0
      baseline_target: 0.8337155963302753
      shared_attention_scale: true
      attention_scale_learning_rate: 0.03
      checkpoints: [0, 100, 300, 600, 1000, 1500, 2000, 3000, 4000, 5000]
      output: experiments/outputs/raw/recovery_sst2_tinystories_8m_fn24_bounded_alpha_attention_shared_scalelr3e2_steps5000.json
  - name: tinystories_28m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-28M
      alpha_s: 22.627416997969522
      baseline_target: 0.8256880733944955
      output: experiments/outputs/raw/recovery_sst2_tinystories_28m_fn24_bounded_alpha_attention_steps10000.json
  - name: tinystories_33m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-33M
      alpha_s: 27.712812921102035
      baseline_target: 0.8451834862385321
      shared_attention_scale: true
      attention_scale_learning_rate: 1.0e-6
      checkpoints: [0, 100, 300, 600, 1000, 1500, 2000, 3000]
      output: experiments/outputs/raw/recovery_sst2_tinystories_33m_fn24_bounded_alpha_attention_shared_steps3000.json
  - name: tinystories_1layer_21m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-1Layer-21M
      alpha_s: 32.0
      baseline_target: 0.8061926605504587
      output: experiments/outputs/raw/recovery_sst2_tinystories_1layer_21m_fn24_bounded_alpha_attention_steps10000.json
  - name: tinystories_2layers_33m_fn24_bounded_alpha_attention
    args:
      model: roneneldan/TinyStories-2Layers-33M
      alpha_s: 32.0
      baseline_target: 0.8577981651376146
      shared_attention_scale: true
      attention_scale_learning_rate: 1.0e-6
      checkpoints: [0, 300, 600, 1000, 1500, 2000, 3000, 4000, 5000]
      output: experiments/outputs/raw/recovery_sst2_tinystories_2layers_33m_fn24_bounded_alpha_attention_shared_steps5000.json

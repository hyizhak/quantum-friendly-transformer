protocol: glue_sequence_classifier
args:
  task: sst2
  model: roneneldan/TinyStories-1M
  baseline_target: 0.823394495412844
  caps: [24]
  checkpoints: [0, 600, 1000, 1500, 2000, 3000, 4000, 5000, 7000, 10000, 12500, 15000, 17500, 20000]
  metric: accuracy
  tolerance: 0.01
  max_length: 128
  pad_to_max_length: true
  batch_size: 16
  eval_batch_size: 32
  grad_accum_steps: 2
  learning_rate: 3e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  train_scope: all
  dtype: bfloat16
  cap_norm_dtype: float32
  max_grad_norm: 1.0
  force_decoder_wrapper: true
  seed: 42
  device: cuda:0
  output: experiments/outputs/raw/recovery_sst2_tinystories_1m_fn24_lr3e4_steps20000_fulltrain.json

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-friendly-transformer"
dynamic = ["version"]
description = "PyTorch normalization layers and attention controls for quantum-friendly Transformer research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yizhan Han", email = "hyz0235@gmail.com"}]
keywords = ["pytorch", "transformer", "normalization", "quantum-machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["torch>=2.4,<3"]

[project.optional-dependencies]
hf = [
    "transformers>=4.46,<5",
    "einops>=0.8,<1",
    "safetensors>=0.4",
]
experiments = [
    "quantum-friendly-transformer[hf]",
    "accelerate>=1,<2",
    "datasets>=3,<5",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2,<3",
    "pyarrow>=17",
    "PyYAML>=6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "tqdm>=4.66",
]
test = ["pytest>=7,<10", "build>=1.2", "setuptools>=77"]
dev = ["quantum-friendly-transformer[experiments,test]", "twine>=6"]

[project.urls]
Repository = "https://github.com/hyizhak/quantum-friendly-transformer"
Issues = "https://github.com/hyizhak/quantum-friendly-transformer/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantum_friendly_transformer*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "quantum_friendly_transformer._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
